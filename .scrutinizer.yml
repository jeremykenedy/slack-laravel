build:
    image: default-jammy
    nodes:
        analysis:
            environment:
                php:
                    version: '8.2.0'
                    ini:
                        xdebug.mode: coverage
            dependencies:
                override:
                    - composer require --dev 'laravel/framework:^11.0' 'laravel/lumen-framework:^11.0' --no-update --no-interaction
                    - command: composer update --no-interaction --prefer-dist
                      environment:
                          COMPOSER_NO_SECURITY_BLOCKING: '1'
            tests:
                override:
                    - php-scrutinizer-run
                    - command: vendor/bin/phpunit --coverage-filter src --coverage-clover build/coverage.xml
                      coverage:
                          file: build/coverage.xml
                          format: clover

filter:
    paths:
        - 'src/*'
    excluded_paths:
        - 'tests/*'
        - 'vendor/*'

checks:
    php: true

tools:
    external_code_coverage: false
